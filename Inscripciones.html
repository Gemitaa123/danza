<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inscripción | Academia Zahra</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #3B2C35;
      color: #F8F4E3;
    }

    header {
      background-color: #1C0F13;
      text-align: center;
      padding: 30px 10px;
    }

    header h1 {
      color: #D4AF37;
      font-size: 36px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 18px;
      margin: 0;
    }

    .formulario {
      background-color: #FAF8F3;
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      color: #3B2C35;
    }

    .formulario h2 {
      text-align: center;
      color: #D4AF37;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 10px;
      background-color: #F0ECE4;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #D4AF37;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #b5932e;
    }

    .frase-final {
      text-align: center;
      margin-top: 40px;
      font-style: italic;
      font-size: 18px;
      color: #F8F4E3;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      background-color: #1C0F13;
      color: #F8F4E3;
      font-size: 14px;
    }

    footer a {
      color: #D4AF37;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Inscríbete a Academia Zahra</h1>
    <p>Llena el formulario para comenzar tu viaje en la danza oriental</p>
  </header>

  <form class="formulario">
    <h2>Formulario de inscripción</h2>

    <label>Nombre completo:</label>
    <input type="text" name="nombre" required>

    <label>Edad:</label>
    <input type="number" name="edad" required>

    <label>Correo electrónico:</label>
    <input type="email" name="correo" required>

    <label>WhatsApp o teléfono:</label>
    <input type="tel" name="telefono" required>

    <label>Nivel de experiencia:</label>
    <select name="nivel">
      <option>Principiante</option>
      <option>Intermedio</option>
      <option>Avanzado</option>
    </select>

    <label>Estilo de danza que te interesa:</label>
    <input type="text" name="estilo">

    <label>Días disponibles:</label>
    <select name="dias">
      <option>Lunes a viernes</option>
      <option>Solo fines de semana</option>
      <option>Flexible</option>
    </select>

    <label>Horario preferido:</label>
    <select name="horario">
      <option>Mañana</option>
      <option>Tarde</option>
      <option>Noche</option>
    </select>

    <label>¿Cómo nos conociste?</label>
    <select name="referencia">
      <option>Instagram</option>
      <option>Facebook</option>
      <option>Google</option>
      <option>Recomendación</option>
    </select>

    <label>Mensaje adicional:</label>
    <textarea name="mensaje" rows="4"></textarea>

    <button type="submit">Enviar inscripción</button>
  </form>

  <p class="frase-final">“La danza es el lenguaje oculto del alma. Estamos listas para verte brillar.”</p>

  <footer>
    <p>© 2025 Academia Zahra | Danza Árabe en Ciudad Juárez</p>
    <p>Contáctanos: <a href="mailto:zahradanza@gmail.com">zahradanza@gmail.com</a></p>
  </footer>

</body>
</html>
